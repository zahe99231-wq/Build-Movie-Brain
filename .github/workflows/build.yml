name: Build Movie Brain APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Gradle project in root
        run: |
          for z in *.zip */*.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z" -d _extracted_tmp || true
            fi
          done
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            SG=$(find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
            if [ -n "$SG" ]; then
              PROJ_DIR=$(dirname "$SG")
              echo "Moving Gradle project from $PROJ_DIR to root"
              cp -r "$PROJ_DIR"/. .
            fi
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movie-brain-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
